<svg viewBox="0 0 120 120" width="120" height="120" xmlns="http://www.w3.org/2000/svg">

  <!-- Anneau extérieur rouge — tourne dans le sens horaire -->
  <circle cx="60" cy="60" r="54" fill="none" stroke="#CC0000" stroke-width="5"
          stroke-dasharray="100 240" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 60 60" to="360 60 60"
                      dur="1.4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="54" fill="none" stroke="#CC0000" stroke-width="5"
          stroke-dasharray="40 300" stroke-linecap="round" stroke-dashoffset="-130" opacity="0.35">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 60 60" to="360 60 60"
                      dur="1.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Anneau milieu jaune — tourne en sens antihoraire -->
  <circle cx="60" cy="60" r="44" fill="none" stroke="#FFD700" stroke-width="4"
          stroke-dasharray="80 196" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 60 60" to="-360 60 60"
                      dur="2.0s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="44" fill="none" stroke="#FFD700" stroke-width="4"
          stroke-dasharray="30 246" stroke-linecap="round" stroke-dashoffset="-100" opacity="0.35">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 60 60" to="-360 60 60"
                      dur="2.0s" repeatCount="indefinite"/>
  </circle>

  <!-- Anneau intérieur vert — tourne dans le sens horaire -->
  <circle cx="60" cy="60" r="34" fill="none" stroke="#009A44" stroke-width="4"
          stroke-dasharray="60 154" stroke-linecap="round">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 60 60" to="360 60 60"
                      dur="2.6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="60" cy="60" r="34" fill="none" stroke="#009A44" stroke-width="4"
          stroke-dasharray="25 189" stroke-linecap="round" stroke-dashoffset="-80" opacity="0.35">
    <animateTransform attributeName="transform" type="rotate"
                      from="0 60 60" to="360 60 60"
                      dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <!-- Arcs empreinte pulsants — SMIL animate opacity -->
  <path d="M60 42 Q74 42 74 56 Q74 70 60 74 Q46 70 46 56 Q46 42 60 42"
        fill="none" stroke="#CC0000" stroke-width="2" stroke-linecap="round">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" begin="0s" repeatCount="indefinite"/>
  </path>
  <path d="M60 47 Q70 47 70 56 Q70 65 60 68 Q50 65 50 56 Q50 47 60 47"
        fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" begin="0.2s" repeatCount="indefinite"/>
  </path>
  <path d="M60 52 Q66 52 66 56 Q66 61 60 63 Q54 61 54 56 Q54 52 60 52"
        fill="none" stroke="#009A44" stroke-width="2" stroke-linecap="round">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" begin="0.4s" repeatCount="indefinite"/>
  </path>
  <path d="M60 37 Q78 37 78 56 Q78 75 60 80 Q42 75 42 56 Q42 37 60 37"
        fill="none" stroke="#FFD700" stroke-width="1.5" stroke-linecap="round">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" begin="0.6s" repeatCount="indefinite"/>
  </path>
  <path d="M60 32 Q82 32 82 56 Q82 80 60 86 Q38 80 38 56 Q38 32 60 32"
        fill="none" stroke="#CC0000" stroke-width="1.2" stroke-linecap="round">
    <animate attributeName="opacity" values="0.1;1;0.1" dur="1.8s" begin="0.8s" repeatCount="indefinite"/>
  </path>

</svg>
