server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Solution magique pour les SPA (React/Vue) : 
    # Si le fichier demandé n'existe pas, renvoie index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Optimisation des assets Vite (cache long terme)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    error_page 404 /index.html;
}